# Ingle for a home lab: Ingle plus Caddy for HTTPS.
# Setup and day-to-day use: https://ingleboard.app/docs/self-hosting/install/
#
# Ingle used to be called Domus. A .env from then still works: each INGLE_*
# setting falls back to its old DOMUS_* name, and the volumes keep their old
# names so your data, backups and certificates carry straight over.
name: ingle

services:
  ingle:
    image: ghcr.io/lukeskelhorn/ingle:${INGLE_TAG:-${DOMUS_TAG:-latest}}
    # Or build from this checkout instead of pulling:
    # build: ..
    restart: unless-stopped
    environment:
      INGLE_TZ: ${INGLE_TZ:-${DOMUS_TZ:-Europe/London}}
      TZ: ${INGLE_TZ:-${DOMUS_TZ:-Europe/London}}
      INGLE_DATE_FORMAT: ${INGLE_DATE_FORMAT:-${DOMUS_DATE_FORMAT:-02/01/2006}}
      INGLE_WEEK_START: ${INGLE_WEEK_START:-${DOMUS_WEEK_START:-monday}}
      INGLE_CURRENCY: ${INGLE_CURRENCY:-${DOMUS_CURRENCY:-GBP}}
      INGLE_BACKUP_KEEP: ${INGLE_BACKUP_KEEP:-${DOMUS_BACKUP_KEEP:-14}}
      INGLE_BACKUP_AT: ${INGLE_BACKUP_AT:-${DOMUS_BACKUP_AT:-03:00}}
      # Only set when PHOTOS_PATH is mounted below.
      INGLE_PHOTOS_DIR: ${INGLE_PHOTOS_DIR:-${DOMUS_PHOTOS_DIR:-}}
      # Caddy's address: believe its X-Forwarded-For, so sign-in and unlock
      # attempts are rate-limited per device, not for the whole house.
      INGLE_TRUSTED_PROXIES: ${INGLE_PROXY_IP:-${DOMUS_PROXY_IP:-172.30.40.2}}
    volumes:
      - ingle-data:/data
      - ${BACKUP_PATH:-./backups}:/backups
      # A read-only photos folder (e.g. a NAS share) for the screensaver.
      # Uncomment, set PHOTOS_PATH and INGLE_PHOTOS_DIR=/photos in .env.
      # - ${PHOTOS_PATH}:/photos:ro
    networks: [ingle]
    # No published port: everything goes through Caddy. For plain HTTP on
    # the LAN without Caddy, see
    # https://ingleboard.app/docs/self-hosting/install/#plain-http-without-caddy

  caddy:
    build: ./caddy
    restart: unless-stopped
    depends_on:
      ingle:
        condition: service_healthy
    environment:
      # Set INGLE_HOSTNAME in .env. (No "required" check here: older
      # Docker Compose versions would also demand the old DOMUS_HOSTNAME.)
      INGLE_HOSTNAME: ${INGLE_HOSTNAME:-${DOMUS_HOSTNAME:-}}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:?set CLOUDFLARE_API_TOKEN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      ingle:
        # Fixed, so Ingle can trust exactly this address.
        ipv4_address: ${INGLE_PROXY_IP:-${DOMUS_PROXY_IP:-172.30.40.2}}

networks:
  ingle:
    ipam:
      config:
        - subnet: ${INGLE_SUBNET:-${DOMUS_SUBNET:-172.30.40.0/24}}

# Named as they were when Ingle was called Domus, so an upgrade keeps the
# same data. A new install gets these names too; they're never shown.
volumes:
  ingle-data:
    name: domus_domus-data
  caddy-data:
    name: domus_caddy-data
  caddy-config:
    name: domus_caddy-config
