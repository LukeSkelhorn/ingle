{{define "title"}}Domus{{end}}
{{define "content"}}
<main class="board">
  <header class="board__header">
    <h1>Domus</h1>
    <div class="board__clock" hx-get="/clock" hx-trigger="every 30s" hx-swap="innerHTML">
      {{template "clock" .}}
    </div>
  </header>
  <p class="board__placeholder">Chores board coming soon.</p>
</main>
{{end}}
{{define "clock"}}<time datetime="{{.ISO}}"><span class="board__time">{{.Time}}</span> <span class="board__date">{{.Weekday}} {{.Date}}</span></time>{{end}}
