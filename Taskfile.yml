# https://taskfile.dev
version: "3"

dotenv: [".env"]

vars:
  BIN: bin/ingle
  IMAGE: ingle:dev
  REGISTRY_IMAGE: ghcr.io/lukeskelhorn/ingle
  # Ingle used to be Domus: releases also go out under the old image name,
  # so installs that still pull it keep getting updates. Drop it at v1.0.
  LEGACY_IMAGE: ghcr.io/lukeskelhorn/domus
  PLATFORMS: linux/amd64,linux/arm64
  BUILDER: ingle-multiarch
  MIGRATIONS: internal/store/migrations/sqlite
  # The version baked into builds: VERSION=v1.2.3 when releasing, otherwise
  # what git describe says (e.g. v0.1.0-3-gabc123-dirty), or "dev".
  BUILD_VERSION:
    sh: echo "${VERSION:-$(git describe --tags --always --dirty 2>/dev/null || echo dev)}"
  LDFLAGS: -s -w -X main.version={{.BUILD_VERSION}}
  DIST: dist

env:
  INGLE_DB_PATH: '{{.INGLE_DB_PATH | default "./data/ingle.db"}}'

tasks:
  default:
    cmds: [task --list]
    silent: true

  setup:
    desc: Install deps and git hooks (needs golangci-lint, lefthook and sqlc, e.g. `brew install golangci-lint lefthook sqlc`)
    preconditions:
      - sh: command -v golangci-lint
        msg: "golangci-lint not found: brew install golangci-lint"
      - sh: command -v lefthook
        msg: "lefthook not found: brew install lefthook"
      - sh: command -v sqlc
        msg: "sqlc not found: brew install sqlc"
    cmds:
      - go mod download
      - lefthook install

  build:
    desc: Build the ingle binary
    sources: ["**/*.go", "web/**/*", "internal/store/migrations/**/*.sql", "internal/store/queries/*.sql", "go.mod", "go.sum"]
    generates: ["{{.BIN}}"]
    cmds:
      - CGO_ENABLED=0 go build -trimpath -ldflags="{{.LDFLAGS}}" -o {{.BIN}} ./cmd/ingle

  run:
    desc: Build and run the server
    deps: [build]
    cmds:
      - ./{{.BIN}}

  dev:
    desc: Run with go run (no build cache)
    cmds:
      - go run ./cmd/ingle

  test:
    desc: Run tests with the race detector
    cmds:
      - go test -race ./...

  pg:up:
    desc: Start a local Postgres in Docker on port 55432 (for Hosted support; self-hosted uses SQLite)
    status:
      - docker ps --format '{{"{{.Names}}"}}' | grep -qx ingle-pg
    cmds:
      - docker rm -f ingle-pg >/dev/null 2>&1 || true
      - docker run -d --name ingle-pg -p 127.0.0.1:55432:5432 -e POSTGRES_USER=ingle -e POSTGRES_PASSWORD=ingle -e POSTGRES_DB=ingle -v ingle-pg:/var/lib/postgresql/data postgres:17
      - until docker exec ingle-pg pg_isready -U ingle -q; do sleep 0.5; done

  pg:down:
    desc: Stop the local Postgres (keeps its data volume)
    cmds:
      - docker rm -f ingle-pg

  test:pg:
    desc: Run the tests on Postgres as well as SQLite (needs `task pg:up`)
    env:
      INGLE_TEST_PG_URL: '{{.INGLE_TEST_PG_URL | default "postgres://ingle:ingle@127.0.0.1:55432/ingle?sslmode=disable"}}'
    cmds:
      - go test -race ./...

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run ./...

  fmt:
    desc: Format code (gofmt -s, gofumpt and goimports via golangci-lint)
    cmds:
      - golangci-lint fmt

  fmt:check:
    desc: Fail if any Go file is not formatted (prints the diff)
    cmds:
      - golangci-lint fmt --diff ./...

  generate:
    desc: Regenerate sqlc query code from internal/store/queries
    cmds:
      - sqlc generate

  check:
    desc: All local checks - sqlc diff, go mod tidy diff, formatting, lint, race tests
    cmds:
      - sqlc diff
      - go mod tidy -diff
      - task: fmt:check
      - task: lint
      - task: test

  check:all:
    desc: check plus a multi-arch Docker image build (run before merging to main)
    cmds:
      - task: check
      - task: docker:buildx

  tidy:
    desc: Tidy go.mod/go.sum
    cmds:
      - go mod tidy

  docker:build:
    desc: Build the Docker image
    cmds:
      - docker build --build-arg VERSION={{.BUILD_VERSION}} -t {{.IMAGE}} .

  docker:builder:
    internal: true
    desc: Create the buildx builder for multi-arch images (once)
    status:
      - docker buildx inspect {{.BUILDER}}
    cmds:
      - docker buildx create --name {{.BUILDER}} --driver docker-container

  docker:buildx:
    desc: Build the image for amd64 and arm64 without pushing (checks both compile)
    deps: [docker:builder]
    cmds:
      - docker buildx build --builder {{.BUILDER}} --platform {{.PLATFORMS}} --build-arg VERSION={{.BUILD_VERSION}} --output type=cacheonly .

  docker:push:
    desc: "Build and push the multi-arch image to GHCR: VERSION=v0.1.0 task docker:push (needs docker login ghcr.io)"
    deps: [docker:builder]
    requires:
      vars: [VERSION]
    preconditions:
      - sh: '[[ "{{.VERSION}}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]'
        msg: "VERSION must look like v1.2.3"
      - sh: test -z "$(git status --porcelain)"
        msg: "Commit or stash your changes first: the image should match a commit"
    cmds:
      - >-
        docker buildx build --builder {{.BUILDER}} --platform {{.PLATFORMS}} --push
        --build-arg VERSION={{.VERSION}}
        --label org.opencontainers.image.version={{.VERSION}}
        --label org.opencontainers.image.revision=$(git rev-parse HEAD)
        -t {{.REGISTRY_IMAGE}}:{{.VERSION}} -t {{.REGISTRY_IMAGE}}:latest
        -t {{.LEGACY_IMAGE}}:{{.VERSION}} -t {{.LEGACY_IMAGE}}:latest .

  dist:
    desc: "Build release archives and checksums into dist/: VERSION=v0.1.0 task dist"
    requires:
      vars: [VERSION]
    cmds:
      - rm -rf {{.DIST}} && mkdir -p {{.DIST}}
      - for: [linux/amd64, linux/arm64, darwin/amd64, darwin/arm64]
        cmd: scripts/dist.sh "{{.VERSION}}" "{{.ITEM}}" "{{.DIST}}" "{{.LDFLAGS}}"
      - cd {{.DIST}} && shasum -a 256 *.tar.gz > checksums.txt && cat checksums.txt

  release:notes:
    desc: "Print a version's section of CHANGELOG.md: VERSION=v0.1.0 task release:notes"
    requires:
      vars: [VERSION]
    cmds:
      - scripts/release-notes.sh "{{.VERSION}}"
    silent: true

  release:dry:
    desc: "Everything a release does except tag and publish: VERSION=v0.1.0 task release:dry"
    requires:
      vars: [VERSION]
    cmds:
      - scripts/release-notes.sh "{{.VERSION}}" > /dev/null
      - task: check:all
      - task: dist
      - tar -xzf {{.DIST}}/ingle_{{.VERSION}}_{{OS}}_{{ARCH}}.tar.gz -C {{.DIST}} && {{.DIST}}/ingle_{{.VERSION}}_{{OS}}_{{ARCH}}/ingle version
      - echo "Dry run OK. Notes for {{.VERSION}}:" && scripts/release-notes.sh "{{.VERSION}}"

  release:
    desc: "Cut a release: checks, binaries, GHCR image, git tag and GitHub release. VERSION=v0.1.0 task release"
    requires:
      vars: [VERSION]
    preconditions:
      - sh: '[[ "{{.VERSION}}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]'
        msg: "VERSION must look like v1.2.3"
      - sh: test "$(git branch --show-current)" = main
        msg: "Release from main"
      - sh: test -z "$(git status --porcelain)"
        msg: "Commit or stash your changes first"
      - sh: git fetch -q origin main && test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
        msg: "main isn't the same as origin/main: pull or push first"
      - sh: "! git rev-parse -q --verify refs/tags/{{.VERSION}} >/dev/null && ! git ls-remote --exit-code --tags origin {{.VERSION}} >/dev/null"
        msg: "Tag {{.VERSION}} already exists"
      - sh: scripts/release-notes.sh "{{.VERSION}}" > /dev/null
        msg: "CHANGELOG.md has no section for {{.VERSION}}: move Unreleased under ## [{{.VERSION}}] - YYYY-MM-DD first"
      - sh: gh auth status > /dev/null 2>&1
        msg: "Not signed in to GitHub: gh auth login"
    cmds:
      - task: check:all
      - task: dist
      - task: docker:push
      - git tag -a {{.VERSION}} -m "Ingle {{.VERSION}}"
      - git push origin {{.VERSION}}
      - scripts/release-notes.sh "{{.VERSION}}" > {{.DIST}}/NOTES.md
      - gh release create {{.VERSION}} --verify-tag --title "Ingle {{.VERSION}}" --notes-file {{.DIST}}/NOTES.md {{if contains "-" .VERSION}}--prerelease{{end}} {{.DIST}}/*.tar.gz {{.DIST}}/checksums.txt
      - echo "Released {{.VERSION}}. Now mark the Linear release complete and update the docs site."

  docker:run:
    desc: Run the Docker image with a local data volume
    deps: [docker:build]
    cmds:
      - docker run --rm -it -p 8080:8080 -v ingle-data:/data {{.IMAGE}}

  migrate:up:
    desc: Apply pending migrations (the server also does this on start)
    cmds:
      - mkdir -p "$(dirname "$INGLE_DB_PATH")"
      - goose -dir {{.MIGRATIONS}} sqlite3 "$INGLE_DB_PATH" up

  migrate:down:
    desc: Roll back the last migration
    cmds:
      - goose -dir {{.MIGRATIONS}} sqlite3 "$INGLE_DB_PATH" down

  migrate:status:
    desc: Show migration status
    cmds:
      - goose -dir {{.MIGRATIONS}} sqlite3 "$INGLE_DB_PATH" status

  migrate:create:
    desc: "Create a new SQL migration: task migrate:create -- add_people"
    requires:
      vars: [CLI_ARGS]
    cmds:
      - goose -dir {{.MIGRATIONS}} -s create {{.CLI_ARGS}} sql
