name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: CLA
    runs-on: ubuntu-latest
    # pull_request_target is safe here only because no step checks out or runs the pull request's code.
    if: github.event_name == 'pull_request_target' || (github.event.issue.pull_request && (contains(github.event.comment.body, 'recheck') || contains(github.event.comment.body, 'I have read the Ingle CLA and agree to it')))
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/LukeSkelhorn/ingle/blob/main/CLA.md
          path-to-signatures: signatures/cla.json
          branch: cla-signatures
          allowlist: LukeSkelhorn,*[bot]
          custom-pr-sign-comment: I have read the Ingle CLA and agree to it.
          custom-notsigned-prcomment: >-
            Thank you for your pull request! Before it can be merged, please read the
            [Ingle Contributor Licence Agreement](https://github.com/LukeSkelhorn/ingle/blob/main/CLA.md).
            You keep your copyright, and Ingle stays AGPL; [CONTRIBUTING.md](https://github.com/LukeSkelhorn/ingle/blob/main/CONTRIBUTING.md)
            explains why it's needed. To sign, reply with the comment below. You only need to do this once.
          custom-allsigned-prcomment: Everyone has signed the CLA. Thank you!
          lock-pullrequest-aftermerge: false
