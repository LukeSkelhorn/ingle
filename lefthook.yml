# Git hooks: install with `task setup` (runs `lefthook install`).
pre-commit:
  parallel: false
  commands:
    fmt:
      glob: "*.go"
      run: golangci-lint fmt {staged_files}
      stage_fixed: true
    fmt-check:
      glob: "*.go"
      run: golangci-lint fmt --diff ./...
    lint:
      glob: "*.go"
      run: golangci-lint run ./...
    mod-tidy:
      glob: "{go.mod,go.sum,*.go}"
      run: go mod tidy -diff
    sqlc:
      glob: "{sqlc.yaml,internal/store/queries/*.sql,internal/store/migrations/**/*.sql,internal/store/dbq/*.go}"
      run: sqlc diff
